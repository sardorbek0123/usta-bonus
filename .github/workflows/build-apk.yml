# GitHub'ga push qilinganda (yoki Actions sahifasidan qo'lda) APK build qiladi.
# Tayyor APK: Actions -> oxirgi run -> Artifacts -> usta-bonus-apk
name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Android papkasini yaratish
        run: |
          flutter create . --org uz.ustabonus --project-name usta_bonus --platforms android
          python3 tool/setup_platforms.py

      - run: flutter pub get

      - name: Kod tahlili
        run: flutter analyze --no-fatal-infos --no-fatal-warnings
        continue-on-error: true

      - name: Testlar
        run: flutter test
        continue-on-error: true

      - name: APK build
        run: flutter build apk --release --split-per-abi

      - uses: actions/upload-artifact@v4
        with:
          name: usta-bonus-apk
          path: build/app/outputs/flutter-apk/*.apk
          retention-days: 14
