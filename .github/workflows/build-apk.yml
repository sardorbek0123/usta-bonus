# GitHub'ga push qilinganda (yoki Actions sahifasidan qo'lda) APK build qiladi.
# Tayyor APK: Releases -> Latest (yoki Actions -> run -> Artifacts)
name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Android papkasini yaratish
        run: |
          flutter create . --org uz.ustabonus --project-name usta_bonus --platforms android
          python3 tool/setup_platforms.py

      - run: flutter pub get

      - name: Kod tahlili
        run: flutter analyze --no-fatal-infos --no-fatal-warnings
        continue-on-error: true

      - name: Testlar
        run: flutter test
        continue-on-error: true

      - name: APK build
        run: flutter build apk --release --split-per-abi

      - uses: actions/upload-artifact@v4
        with:
          name: usta-bonus-apk
          path: build/app/outputs/flutter-apk/*.apk
          retention-days: 14

      # Telefonda to'g'ridan-to'g'ri yuklab olish uchun: Releases -> Latest
      - name: Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Usta Bonus demo ${{ github.run_number }}
          make_latest: true
          body: |
            Demo build. Kirish: istalgan raqam, kod 111111. Demo usta: 90 000 00 00.
            Ko'pchilik telefonlarga: app-arm64-v8a-release.apk
          files: build/app/outputs/flutter-apk/*.apk
